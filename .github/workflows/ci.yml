name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # fastapi==0.104.0 / pydantic==2.5.0 support 3.8+; 3.10/3.11 are the
        # safest widely-used versions to pin CI to for now.
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests (pytest)
        run: pytest tests/

      - name: Lint (ruff)
        # Non-blocking for now: the codebase hasn't been fully audited against
        # this lint config yet, and the priority is not breaking CI for the
        # whole team on day one. Flip to blocking once the codebase is
        # confirmed clean / rules have settled.
        continue-on-error: true
        run: |
          ruff check .
