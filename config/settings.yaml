# AI-ITSS Configuration
#
# This file intentionally holds no secrets or environment-specific values —
# only non-sensitive application configuration and feature toggles.
# For API tokens, base URLs that vary per environment, and other secrets
# (e.g. Zoho credentials), see `.env.example` at the repo root, copy it to
# `.env`, and fill in real values there.

app:
  name: "AI-ITSS"
  version: "0.1.0"
  environment: "development"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

workflow:
  # Confidence thresholds for routing decisions
  confidence_thresholds:
    escalate: 0.5  # Below this: escalate
    review: 0.75   # Between escalate and review: human review
    auto: 0.85     # Above this: ready for agent

integrations:
  # Zoho CRM configuration
  zoho:
    enabled: false
    api_base_url: "https://www.zohoapis.com"
    api_version: "v1"
    # API credentials should be in environment variables
    # Maps internal field names to Zoho field names. Override any of these
    # if your Zoho org uses custom field names. Any keys omitted here fall
    # back to the built-in defaults.
    field_map:
      subject: "Subject"
      description: "Description"
      priority: "Priority"
      status: "Status"
      contact_name: "Contact_Name"
      email: "Email"
      phone: "Phone"
      account_name: "Account_Name"
      ticket_url: "ticket_url"
  
  # Jira configuration
  jira:
    enabled: false
    api_base_url: "https://your-jira-instance.atlassian.net"
    api_version: "v3"
    # API credentials should be in environment variables
  
  # MCP/Plugin configuration
  mcp:
    enabled: false
    plugin_directory: "./mcp_plugins"

mcp_plugins:
  # Example MCP plugins (to be implemented in Phase 2)
  knowledge_base:
    enabled: false
    type: "confluent"
  
  diagnostics:
    enabled: false
    type: "custom"
  
  slack:
    enabled: false
    type: "slack"
  
  confluence:
    enabled: false
    type: "confluence"

database:
  type: "postgresql"  # or sqlite for local dev
  # Connection details in environment variables
