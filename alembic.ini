[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# make sure the repo root is importable so `migrations/env.py` can
# `import backend.models.db...` regardless of the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# timezone =

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate
revision_environment = false

# version path separator; As mentioned above, this is the character used to split
version_path_separator = os

# the output encoding used when revision files are written
output_encoding = utf-8

# The actual DB URL is intentionally left blank here -- migrations/env.py
# overrides it at runtime from the DATABASE_URL environment variable (the
# same one backend/models/db/base.py reads), so alembic.ini never needs to
# hardcode credentials or drift from the app's own default.
sqlalchemy.url =


[post_write_hooks]
# no post-write hooks configured

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
